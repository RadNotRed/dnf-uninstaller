[package]
name = "linux-rust-uninstaller"
version = "0.1.6"
edition = "2024"
description = "A desktop application uninstaller and cleanup utility for Linux"

[dependencies]
base64 = "0.23"
gtk = "0.18"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
